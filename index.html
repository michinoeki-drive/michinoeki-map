<!-- Firebase v10 -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script>
/* ============================================================
 *  Firebase 設定
 * ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "000000000000",
  appId: "1:000000000000:web:xxxxxxxxxxxxxxxx"
};

// スタンプ判定距離（メートル）
const STAMP_RADIUS_M = 100;

// ===== グローバル状態 =====
const state = {
  stations: [],
  visited: {},
  pos: null,             // {lat, lon, acc, isApprox: true/false}
  watchId: null,
  map: null,
  markers: {},
  posMarker: null,
  posCircle: null,
  currentStation: null,
  firebaseReady: false,
  deviceId: null,
};

// ===== 距離計算（Haversine 公式）=====
function distance(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function fmtDist(m) {
  if (m == null) return "距離不明";
  if (m < 1000) return `${Math.round(m)}m`;
  return `${(m/1000).toFixed(1)}km`;
}

function getLocationLabel(pos) {
  if (!pos) return '位置情報なし';
  if (pos.locationName) return pos.locationName;
  if (pos.regionName) return pos.regionName;
  return `${pos.lat.toFixed(4)}, ${pos.lon.toFixed(4)}`;
}

function buildLocationName(address, fallback = '現在地') {
  if (!address) return fallback;

  // 1. 都道府県を取得
  const stateName = address.state || address.province || address.region || '';
  
  // 2. 市区町村を取得
  const cityName = address.city || address.town || address.village || address.municipality || address.county || '';
  
  // 3. 地区・町名を取得
  const districtName = address.suburb || address.neighbourhood || address.city_district || '';

  // 取得できた要素を順につなげる
  let result = '';
  if (stateName) result += stateName;
  if (cityName && !result.includes(cityName)) result += cityName;
  if (districtName && !result.includes(districtName)) result += districtName;

  return result || fallback;
}

async function reverseGeocode(lat, lon) {
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=10&addressdetails=1`, {
      headers: { 'Accept-Language': 'ja' }
    });
    if (!res.ok) throw new Error('reverse geo failed');
    const data = await res.json();
    const addr = data && data.address ? data.address : {};
    const label = buildLocationName(addr, data && data.display_name ? data.display_name.split(',').slice(0, 3).join(',') : '現在地');
    return { displayName: label, address: addr };
  } catch (e) {
    console.warn('Reverse geocode failed:', e);
    return null;
  }
}

// ===== トースト =====
function toast(msg, dur=2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

// ===== 端末ID =====
function getDeviceId() {
  let id = localStorage.getItem('mne-device-id');
  if (!id) {
    id = 'dev-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    localStorage.setItem('mne-device-id', id);
  }
  return id;
}

// ===== Firebase 初期化 =====
let db = null, auth = null;
async function initFirebase() {
  if (FIREBASE_CONFIG.apiKey === "YOUR_API_KEY") {
    console.warn("Firebase未設定：localStorage のみで動作します");
    return false;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    auth = firebase.auth();
    await auth.signInAnonymously();
    state.deviceId = auth.currentUser.uid;
    document.getElementById('device-id').textContent = state.deviceId.slice(0,8) + '...';

    const doc = await db.collection('users').doc(state.deviceId).get();
    if (doc.exists) state.visited = doc.data().visited || {};

    db.collection('users').doc(state.deviceId).onSnapshot(d => {
      if (d.exists) {
        state.visited = d.data().visited || {};
        render();
      }
    });

    state.firebaseReady = true;
    return true;
  } catch (e) {
    console.error("Firebase init failed:", e);
    toast("クラウド同期不可、端末内保存で動作");
    return false;
  }
}

// ===== 訪問データの保存 =====
async function saveVisited() {
  localStorage.setItem('mne-visited', JSON.stringify(state.visited));
  if (state.firebaseReady && db) {
    try {
      await db.collection('users').doc(state.deviceId)
        .set({ visited: state.visited, updated: Date.now() }, { merge: true });
    } catch (e) {
      console.error("cloud save failed:", e);
    }
  }
}

// ===== データ読込 =====
async function loadStations() {
  const res = await fetch('stations.json');
  const data = await res.json();
  state.stations = data.stations.filter(s => s.lat && s.lon);
  const stored = localStorage.getItem('mne-visited');
  if (stored) state.visited = JSON.parse(stored);
}

// ===== IP / ネットワークによるおおよその位置情報取得（フォールバック） =====
async function fetchIPLocation() {
  toast("GPSオフのため、ネットワークからおおよその位置を取得中…");

  let lat = null, lon = null, locationHint = '';

  try {
    const res = await fetch('https://ipwho.is/');
    const data = await res.json();
    if (data && data.success) {
      lat = data.latitude;
      lon = data.longitude;
      locationHint = [data.region, data.city].filter(Boolean).join('');
    }
  } catch (e) {
    console.warn("ipwho.is failed:", e);
  }

  if (lat == null || lon == null) {
    try {
      const res = await fetch('https://ipapi.co/json/');
      const data = await res.json();
      if (data && data.latitude && data.longitude) {
        lat = parseFloat(data.latitude);
        lon = parseFloat(data.longitude);
        locationHint = [data.region, data.city].filter(Boolean).join('');
      }
    } catch (e) {
      console.warn("ipapi.co failed:", e);
    }
  }

  if (lat == null || lon == null) {
    try {
      const res = await fetch('https://ip-api.com/json/?lang=ja');
      const data = await res.json();
      if (data && data.status === 'success') {
        lat = data.lat;
        lon = data.lon;
        locationHint = [data.regionName, data.city].filter(Boolean).join('');
      }
    } catch (e) {
      console.warn("ip-api.com failed:", e);
    }
  }

  if (lat != null && lon != null) {
    const geoResult = await reverseGeocode(lat, lon);
    const displayName = geoResult ? geoResult.displayName : (locationHint || 'IP位置推計');

    state.pos = {
      lat: lat,
      lon: lon,
      acc: 5000,
      isApprox: true,
      regionName: displayName,
      locationName: displayName
    };

    toast(`おおよその位置を取得しました (${displayName})`);
    updatePosMarker();
    render();
  } else {
    toast("位置情報の取得に失敗しました");
  }

  document.getElementById('locate-btn').classList.remove('on');
}

// ===== 現在地取得 =====
function startGeo() {
  if (!navigator.geolocation) {
    fetchIPLocation();
    return;
  }
  document.getElementById('locate-btn').classList.add('on');
  state.watchId = navigator.geolocation.watchPosition(
    async pos => {
      state.pos = {
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        acc: pos.coords.accuracy,
        isApprox: false,
        locationName: '現在地を取得中…'
      };
      const result = await reverseGeocode(pos.coords.latitude, pos.coords.longitude);
      if (result) {
        state.pos.locationName = result.displayName;
        state.pos.regionName = result.displayName;
        state.pos.address = result.address;
      }
      updatePosMarker();
      render();
    },
    err => {
      console.warn("GPS Location error, fallback to IP location:", err);
      fetchIPLocation();
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
  );
}

function stopGeo() {
  if (state.watchId != null) navigator.geolocation.clearWatch(state.watchId);
  state.watchId = null;
  document.getElementById('locate-btn').classList.remove('on');
}

// ===== 地図 =====
function initMap() {
  state.map = L.map('map', { zoomControl: true }).setView([36.5, 138], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 18
  }).addTo(state.map);

  state.stations.forEach(s => {
    const visited = !!state.visited[s.id];
    const color = visited ? '#4caf50' : '#90a4ae';
    const icon = L.divIcon({
      className: 'st-marker',
      html: `<div style="background:${color};width:16px;height:16px;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.5);"></div>`,
      iconSize: [16,16], iconAnchor: [8,8]
    });
    const m = L.marker([s.lat, s.lon], { icon })
      .bindTooltip(s.name, { direction: 'top' })
      .on('click', () => openStation(s));
    m.addTo(state.map);
    state.markers[s.id] = m;
  });
}

function updateMapMarkers() {
  Object.entries(state.markers).forEach(([id, m]) => {
    const visited = !!state.visited[id];
    const color = visited ? '#4caf50' : '#90a4ae';
    m.setIcon(L.divIcon({
      className: 'st-marker',
      html: `<div style="background:${color};width:16px;height:16px;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.5);"></div>`,
      iconSize: [16,16], iconAnchor: [8,8]
    }));
  });
}

function updatePosMarker() {
  if (!state.pos || !state.map) return;
  const { lat, lon, acc, isApprox } = state.pos;
  const color = isApprox ? '#ff9800' : '#2196f3';

  if (!state.posMarker) {
    state.posMarker = L.circleMarker([lat, lon], {
      radius: 8, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1
    }).addTo(state.map);
    
    state.posCircle = L.circle([lat, lon], {
      radius: acc, color: color, weight: 1, fillOpacity: 0.1, dashArray: isApprox ? '4, 4' : null
    }).addTo(state.map);
    
    state.map.setView([lat, lon], isApprox ? 10 : 13);
  } else {
    state.posMarker.setLatLng([lat, lon]);
    state.posMarker.setStyle({ fillColor: color });
    state.posCircle.setLatLng([lat, lon]).setRadius(acc).setStyle({ color: color, dashArray: isApprox ? '4, 4' : null });
  }
}

// ===== リスト描画 =====
function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filter = document.getElementById('filter').value;

  let approxBanner = document.getElementById('approx-banner');
  if (state.pos) {
    const locationText = getLocationLabel(state.pos);
    if (state.pos.isApprox) {
      if (!approxBanner) {
        approxBanner = document.createElement('div');
        approxBanner.id = 'approx-banner';
        approxBanner.className = 'approx-banner';
        const listView = document.getElementById('list-view');
        listView.insertBefore(approxBanner, listView.children[1]);
      }
      approxBanner.innerHTML = `⚠️ GPS未取得のため、ネットワークによる<b>おおよその現在地</b>を表示しています<br>📍 ${escapeHtml(locationText)}`;
    } else if (approxBanner) {
      approxBanner.remove();
    }
  } else if (approxBanner) {
    approxBanner.remove();
  }

  updateLocationBar();

  let items = state.stations.map(s => {
    const dist = state.pos ? distance(state.pos.lat, state.pos.lon, s.lat, s.lon) : null;
    return { ...s, _dist: dist, _visited: !!state.visited[s.id] };
  });

  if (q) {
    items = items.filter(s =>
      s.name.toLowerCase().includes(q) ||
      s.pref.toLowerCase().includes(q) ||
      (s.addr || '').toLowerCase().includes(q)
    );
  }
  if (filter === 'unvisited') items = items.filter(s => !s._visited);
  if (filter === 'visited') items = items.filter(s => s._visited);

  if (state.pos) {
    items.sort((a, b) => {
      if (a._visited !== b._visited) return a._visited ? 1 : -1;
      if (!a._visited) return a._dist - b._dist;
      return (state.visited[b.id]?.ts || 0) - (state.visited[a.id]?.ts || 0);
    });
  } else {
    items.sort((a, b) => {
      if (a._visited !== b._visited) return a._visited ? 1 : -1;
      return a.pref.localeCompare(b.pref, 'ja');
    });
  }

  const body = document.getElementById('list-body');
  if (items.length === 0) {
    body.innerHTML = '<div class="empty">該当する道の駅はありません</div>';
  } else {
    body.innerHTML = items.slice(0, 300).map(s => {
      const near = s._dist != null && s._dist <= STAMP_RADIUS_M && !s._visited && !state.pos?.isApprox;
      const cls = ['station-item', s._visited ? 'visited' : '', near ? 'near' : ''].join(' ');
      const icon = s._visited ? '✓' : (near ? '🎯' : '📍');
      const distText = s._visited
        ? '訪問済'
        : (s._dist != null ? (state.pos?.isApprox ? `約${fmtDist(s._dist)}` : fmtDist(s._dist)) : '—');
      return `
        <div class="${cls}" data-id="${escapeHtml(s.id)}">
          <div class="station-icon">${icon}</div>
          <div class="station-info">
            <div class="station-name">${escapeHtml(s.name)}</div>
            <div class="station-meta">
              <span>${escapeHtml(s.pref)}</span>
              <span>${escapeHtml(s.addr || '')}</span>
            </div>
          </div>
          <div class="station-dist">${distText}</div>
        </div>`;
    }).join('');

    body.querySelectorAll('.station-item').forEach(el => {
      el.addEventListener('click', () => {
        const s = state.stations.find(x => String(x.id) === el.dataset.id);
        if (s) openStation(s);
      });
    });
    if (items.length > 300) {
      body.insertAdjacentHTML('beforeend', `<div class="empty">…他 ${items.length - 300} 駅（検索で絞り込んでください）</div>`);
    }
  }

  updateProgress();
  if (state.map) updateMapMarkers();
}

function updateLocationBar() {
  const bar = document.getElementById('location-bar');
  const label = document.getElementById('location-name');
  if (!state.pos || state.pos.isApprox) {
    bar.classList.add('hidden');
    return;
  }
  const name = getLocationLabel(state.pos);
  label.textContent = name || '現在地を取得中…';
  bar.classList.remove('hidden');
}

function updateProgress() {
  const total = state.stations.length;
  const done = Object.keys(state.visited).length;
  const pct = total ? (done/total*100).toFixed(1) : 0;
  document.getElementById('badge-count').textContent = `${done} / ${total}`;
  document.getElementById('badge-pct').textContent = `制覇 ${pct}%`;
  document.getElementById('stat-count').textContent = done;
  document.getElementById('stat-pct').textContent = pct;
  document.getElementById('stat-bar').style.width = pct + '%';

  const byPref = {};
  state.stations.forEach(s => {
    if (!byPref[s.pref]) byPref[s.pref] = { done: 0, total: 0 };
    byPref[s.pref].total++;
    if (state.visited[s.id]) byPref[s.pref].done++;
  });

  // 都道府県リスト表示
  const html = Object.entries(byPref)
    .sort((a,b) => b[1].done/b[1].total - a[1].done/a[1].total)
    .map(([pref, c]) => {
      const isDone = c.done === c.total && c.total > 0;
      return `<div class="pref-row ${isDone ? 'done' : ''}">
        <span>${isDone ? '👑 ' : ''}${escapeHtml(pref)}</span>
        <span class="count">${c.done} / ${c.total}</span>
      </div>`;
    }).join('');
  document.getElementById('pref-list').innerHTML = html;

  // 都道府県ボタンのヒートマップを更新
  Object.entries(byPref).forEach(([pref, c]) => {
    // 都道府県コード（英字）と日本語名のマッピング
    const prefMap = {
      '北海道': 'hokkaido',
      '青森県': 'aomori',
      '岩手県': 'iwate',
      '宮城県': 'miyagi',
      '秋田県': 'akita',
      '山形県': 'yamagata',
      '福島県': 'fukushima',
      '茨城県': 'ibaraki',
      '栃木県': 'tochigi',
      '群馬県': 'gunma',
      '埼玉県': 'saitama',
      '千葉県': 'chiba',
      '東京都': 'tokyo',
      '神奈川県': 'kanagawa',
      '新潟県': 'nigata',
      '富山県': 'toyama',
      '石川県': 'ishikawa',
      '福井県': 'fukui',
      '山梨県': 'yamanashi',
      '長野県': 'nagano',
      '岐阜県': 'gifu',
      '静岡県': 'shizuoka',
      '愛知県': 'aichi',
      '三重県': 'mie',
      '滋賀県': 'shiga',
      '京都府': 'kyoto',
      '大阪府': 'osaka',
      '兵庫県': 'hyougo',
      '奈良県': 'nara',
      '和歌山県': 'wakayama',
      '鳥取県': 'tottori',
      '島根県': 'shimane',
      '岡山県': 'okayama',
      '広島県': 'hiroshima',
      '山口県': 'yamaguchi',
      '徳島県': 'tokushima',
      '香川県': 'kagawa',
      '愛媛県': 'ehime',
      '高知県': 'kouchi',
      '福岡県': 'fukuoka',
      '佐賀県': 'saga',
      '長崎県': 'nagasaki',
      '熊本県': 'kumamoto',
      '大分県': 'oita',
      '宮崎県': 'miyazaki',
      '鹿児島県': 'kagoshima',
      '沖縄県': 'okinawa'
    };

    const btnId = prefMap[pref];
    const el = document.getElementById(btnId);
    if (el) {
      const ratio = c.total > 0 ? c.done / c.total : 0;
      
      // レベルクラスを設定
      el.classList.remove('pref-level-0', 'pref-level-1', 'pref-level-2', 'pref-level-3', 'pref-level-4', 'pref-done');
      
      if (ratio === 0) el.classList.add('pref-level-0');
      else if (ratio <= 0.25) el.classList.add('pref-level-1');
      else if (ratio <= 0.5) el.classList.add('pref-level-2');
      else if (ratio < 1.0) el.classList.add('pref-level-3');
      else {
        el.classList.add('pref-level-4', 'pref-done');
      }

      // クリックイベントで制覇率を表示
      el.onclick = () => {
        const pctVal = (ratio * 100).toFixed(1);
        toast(`【${pref}】 制覇率 ${pctVal}% (${c.done}/${c.total}駅)`);
      };
    }
  });
}

// ===== モーダル =====
function openStation(s) {
  state.currentStation = s;
  const visited = !!state.visited[s.id];
  const dist = state.pos ? distance(state.pos.lat, state.pos.lon, s.lat, s.lon) : null;
  const isApprox = state.pos && state.pos.isApprox;
  const near = dist != null && dist <= STAMP_RADIUS_M && !isApprox;

  document.getElementById('m-name').textContent = s.name;
  document.getElementById('m-sub').textContent = `${s.pref} ${s.addr || ''}`;
  document.getElementById('m-year').innerHTML = s.year ? `<b>登録:</b> ${escapeHtml(s.touroku || '')} (${escapeHtml(s.year)})` : '';
  document.getElementById('m-addr').innerHTML = `<b>座標:</b> ${s.lat.toFixed(5)}, ${s.lon.toFixed(5)}`;
  document.getElementById('m-hp').innerHTML = s.hp ? `<b>HP:</b> <a href="${escapeHtml(s.hp)}" target="_blank" rel="noopener">公式ページ</a>` : '';
  const fac = s.facilities || {};
  const facMap = { restaurant:'🍴レストラン', onsen:'♨️温泉', camp:'⛺キャンプ', ev:'🔌EV充電', wifi:'📶Wi-Fi', shop:'🛍️売店' };
  const facList = Object.keys(fac).filter(k => fac[k]).map(k => facMap[k]).filter(Boolean).join(' ');
  document.getElementById('m-facil').innerHTML = facList ? `<b>施設:</b> ${facList}` : '';

  const distLabel = !state.pos
    ? '不明'
    : isApprox
      ? `約${fmtDist(dist)} (※おおよその位置)`
      : `${fmtDist(dist)} (GPS精度 ±${Math.round(state.pos.acc)}m)`;
  document.getElementById('m-cur').innerHTML = '';
  document.getElementById('m-dist').innerHTML = `<b>距離:</b> ${distLabel}`;

  const hint = document.getElementById('m-hint');
  const btn = document.getElementById('m-stamp');
  if (visited) {
    const d = new Date(state.visited[s.id].ts);
    hint.className = 'stamp-hint ok';
    hint.textContent = `✅ ${d.toLocaleString('ja-JP')} にスタンプ済み`;
    btn.textContent = '取り消す';
    btn.className = 'btn danger';
    btn.disabled = false;
  } else if (!state.pos) {
    hint.className = 'stamp-hint err';
    hint.textContent = '📍 位置情報を有効にしてください';
    btn.textContent = 'スタンプを押す';
    btn.className = 'btn primary';
    btn.disabled = true;
  } else if (isApprox) {
    hint.className = 'stamp-hint ng';
    hint.textContent = '⚠️ 現在おおよその位置情報を利用中のため、スタンプ判定を行うには高精度GPSの許可が必要です';
    btn.textContent = 'スタンプを押す';
    btn.className = 'btn primary';
    btn.disabled = true;
  } else if (near) {
    hint.className = 'stamp-hint ok';
    hint.textContent = `🎯 半径${STAMP_RADIUS_M}m以内！スタンプが押せます`;
    btn.textContent = '🎯 スタンプを押す';
    btn.className = 'btn primary';
    btn.disabled = false;
  } else {
    hint.className = 'stamp-hint ng';
    hint.textContent = `あと ${fmtDist(dist - STAMP_RADIUS_M)} 近づくとスタンプできます`;
    btn.textContent = 'スタンプを押す';
    btn.className = 'btn primary';
    btn.disabled = true;
  }

  const mapViewBtn = document.getElementById('m-show-map');
  const isMapActive = document.getElementById('map-view').classList.contains('active');
  mapViewBtn.style.display = isMapActive ? 'none' : 'block';

  document.getElementById('m-nav').onclick = () => {
    window.open(`https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}&travelmode=driving`, '_blank');
  };

  document.getElementById('m-nav-apple').onclick = () => {
    const appleUrl = `https://maps.apple.com/?daddr=${s.lat},${s.lon}&dirflg=d`;
    window.open(appleUrl, '_blank');
  };

  mapViewBtn.onclick = () => {
    document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
    
    document.querySelector('#tabs button[data-view="map-view"]').classList.add('active');
    document.getElementById('map-view').classList.add('active');
    
    if (state.map) {
      setTimeout(() => {
        state.map.invalidateSize();
        state.map.setView([s.lat, s.lon], 14);
        const marker = state.markers[s.id];
        if (marker) marker.openTooltip();
      }, 100);
    }
  };

  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  state.currentStation = null;
}

async function doStamp() {
  const s = state.currentStation;
  if (!s) return;
  const visited = !!state.visited[s.id];
  if (visited) {
    if (!confirm('スタンプを取り消しますか？')) return;
    delete state.visited[s.id];
    await saveVisited();
    toast('スタンプを取り消しました');
  } else {
    if (!state.pos || state.pos.isApprox) {
      toast('高精度GPSの位置情報が必要です');
      return;
    }
    const d = distance(state.pos.lat, state.pos.lon, s.lat, s.lon);
    if (d > STAMP_RADIUS_M) { toast('もう少し近づいてください'); return; }
    state.visited[s.id] = { ts: Date.now(), lat: state.pos.lat, lon: state.pos.lon };
    await saveVisited();
    toast(`🎉 ${s.name} にスタンプ！`);
  }
  render();
  openStation(s);
}

// ===== エクスポート／インポート／リセット =====
function exportData() {
  const blob = new Blob([JSON.stringify({ visited: state.visited, exported: new Date().toISOString() }, null, 2)],
                       { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `michinoeki-stamps-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importData(file) {
  const r = new FileReader();
  r.onload = async e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.visited && confirm(`${Object.keys(data.visited).length} 件のスタンプを取り込みますか？（既存に追加）`)) {
        Object.assign(state.visited, data.visited);
        await saveVisited();
        render();
        toast('取り込みました');
      }
    } catch (e) { toast('JSON形式が不正です'); }
  };
  r.readAsText(file);
}
async function resetAll() {
  if (!confirm('本当に全スタンプを削除しますか？（元に戻せません）')) return;
  state.visited = {};
  await saveVisited();
  render();
  toast('リセットしました');
}

// ===== ユーティリティ =====
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ===== 初期化 =====
async function init() {
  document.getElementById('device-id').textContent = getDeviceId().slice(0,10);
  await initFirebase();
  await loadStations();
  initMap();
  render();

  // タブ切替
  document.querySelectorAll('#tabs button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById(b.dataset.view).classList.add('active');
      if (b.dataset.view === 'map-view' && state.map) {
        setTimeout(() => state.map.invalidateSize(), 100);
      }
    };
  });

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('filter').addEventListener('change', render);
  document.getElementById('m-stamp').addEventListener('click', doStamp);
  document.getElementById('m-close').addEventListener('click', closeModal);
  document.getElementById('reload-btn').addEventListener('click', () => window.location.reload());
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target.id === 'modal') closeModal();
  });
  document.getElementById('locate-btn').addEventListener('click', () => {
    if (state.watchId != null) stopGeo();
    else startGeo();
  });
  document.getElementById('export-btn').addEventListener('click', exportData);
  document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file').click());
  document.getElementById('import-file').addEventListener('change', e => {
    if (e.target.files[0]) importData(e.target.files[0]);
  });
  document.getElementById('reset-btn').addEventListener('click', resetAll);

  // 起動時に位置情報を求める
  startGeo();

  document.getElementById('splash').classList.add('hide');
  setTimeout(() => document.getElementById('splash').remove(), 500);
}

init();
</script>
